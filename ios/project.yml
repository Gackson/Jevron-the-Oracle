name: JEV
options:
  bundleIdPrefix: com.jev
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  JEV:
    type: application
    platform: iOS
    sources:
      - path: JEV
        excludes: [Resources]
      - path: JEV/Resources/Media
        type: folder
        buildPhase: resources
      - path: JEV/Resources/Language
        type: folder
        buildPhase: resources
      - path: JEV/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: JEV/Resources/Localization
        buildPhase: resources
    info:
      path: JEV/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Fonts/NotoSerifCJKsc-Regular.otf]
        CFBundleLocalizations: [en, zh-Hans]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jev.oracle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Jevons the Oracle
        ASSETCATALOG_COMPILER_APPICON_NAME: OracleIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Turn your spoken question into text for you to review before sending.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Transcribe your question so you can review and edit it before sending.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
  JEVTests:
    type: bundle.unit-test
    platform: iOS
    sources: [JEVTests]
    dependencies:
      - target: JEV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  JEVUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [JEVUITests]
    dependencies:
      - target: JEV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  JEV:
    build:
      targets:
        JEV: all
    test:
      targets: [JEVTests, JEVUITests]
